    framework: OpenAI Codex
    tool_setup: Human-directed AI research and formalization, multiple agents for independent
      proof review, Lean tactics, and finite certificate generation and checking.
    prompting_notes: The author requested improvements to superpermutation bounds, independent
      proof review, complete formalizations, readable mathematical accounts, and a subsequent
      Palomar-compatible port.
  notes: The research presented here, the Lean formalization, and the accompanying documents were
    generated entirely by AI systems under Jay Pantone's direction. Inherited mathematical work
